syntax = "proto3";

package analytics;

service AnalyticsService {
  rpc GetFleetHealth (FleetHealthRequest) returns (FleetHealthResponse) {}
}

message FleetHealthRequest {
  string robotId = 1;
}

message FleetHealthResponse {
  string robotId = 1;
  double averageBatteryDrainPerReading = 2;
  double uptimePercentage = 3;
  string healthScore = 4;
}